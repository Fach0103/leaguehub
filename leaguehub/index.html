<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeagueHub</title>

  <!-- CSS: tokens/base primero, luego uno por componente/vista -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components/navbar.css" />
  <link rel="stylesheet" href="css/components/footer.css" />
  <!-- Fase 2+: <link rel="stylesheet" href="css/views/leagues.css" />, etc. -->
</head>
<body>
  <league-navbar></league-navbar>

  <main id="view-root">
    <!-- El router inyecta aquí el contenido de cada vista -->
  </main>

  <league-footer></league-footer>

  <!--
    Scripts clásicos (NO type="module"): con file:// Chrome bloquea
    los ES Modules por CORS. Todo se cuelga del namespace global LH,
    así que el ORDEN de carga importa: definiciones antes que usos.
  -->

  <!-- Núcleo -->
  <script src="js/router.js"></script>

  <!-- Componentes (Custom Elements) -->
  <script src="js/components/NavBar.js"></script>
  <script src="js/components/Footer.js"></script>

  <!-- Vistas: cada una registra LH.views.<nombre> -->
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/leagues.js"></script>
  <script src="js/views/teams.js"></script>
  <script src="js/views/teamDetail.js"></script>
  <script src="js/views/players.js"></script>
  <script src="js/views/playerDetail.js"></script>
  <script src="js/views/matches.js"></script>
  <script src="js/views/matchDetail.js"></script>
  <script src="js/views/stats.js"></script>

  <!-- Arranque: siempre al final -->
  <script src="js/app.js"></script>
</body>
</html>
